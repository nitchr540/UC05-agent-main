# UC05 reusable workflow 3: refresh docs/ after a merge to main.
# Called from the service repo. That repo is checked out to ./repo and this agent repo to ./uc05-agent.
name: UC05 Refresh Repository Documentation
on:
  workflow_call:
    inputs:
      agent_repository:
        description: owner/name of the UC05 agent repository
        type: string
        required: false
        default: ayushptl2307/UC05-agent   # <-- set once: your GitHub username/agent repo name
      agent_ref:
        description: Branch, tag or SHA of the agent repository to use
        type: string
        required: false
        default: main
      full_regeneration:
        description: Document every service from its full source (first run)
        type: boolean
        required: false
        default: false
      base_sha:
        description: Optional base commit (incremental mode)
        type: string
        required: false
        default: ""
      llm_base_url:
        description: Optional override; leave empty to use the agent repo default
        type: string
        required: false
        default: ""
      llm_model:
        description: Optional override; leave empty to use the agent repo default
        type: string
        required: false
        default: ""
    secrets:
      LLM_API_KEY:
        required: false
      UC05_AGENT_TOKEN:
        description: Read-only token for the agent repo; only needed when that repo is private or internal
        required: false
permissions:
  contents: write
  pull-requests: write
jobs:
  update-docs:
    runs-on: ubuntu-latest
    env:
      UC_REPO_ROOT: ${{ github.workspace }}/repo
      PYTHONPATH: ${{ github.workspace }}/uc05-agent
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 0
      - name: Check out UC05 agent
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.agent_repository }}
          ref: ${{ inputs.agent_ref }}
          path: uc05-agent
          token: ${{ secrets.UC05_AGENT_TOKEN || github.token }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r uc05-agent/requirements.txt
      - name: Generate documentation
        id: docs
        env:
          DOC_BASE_SHA: ${{ github.event_name == 'push' && github.event.before || inputs.base_sha }}
          DOC_HEAD_SHA: ${{ github.sha }}
          DOC_FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full_regeneration || 'false' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ inputs.llm_model || 'gemini-3.1-flash-lite' }}   # <-- central default
          LLM_BASE_URL: ${{ inputs.llm_base_url || 'https://generativelanguage.googleapis.com/v1beta/openai/' }}   # <-- central default
          LLM_TIMEOUT_SECONDS: "60"
        run: python -m agent.doc_updater
      - name: Guard - only docs may change
        shell: bash
        working-directory: repo
        run: |
          OUTSIDE=$(git status --porcelain | cut -c4- | grep -v -e '^docs/' -e '__pycache__' || true)
          if [ -n "$OUTSIDE" ]; then
            echo "::error::Files outside docs/ changed:"; echo "$OUTSIDE"; exit 1
          fi
      - name: Open or update docs review PR
        if: steps.docs.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          path: repo
          branch: automation/docs-update
          title: "[Docs] Update generated documentation"
          commit-message: "docs: update generated documentation"
          body: "Generated by the Update Documentation workflow. Review the wording before merging."
          draft: true
          add-paths: |
            docs/ARCHITECTURE.md
            docs/API.md
            docs/CHANGE_HISTORY.md
